      - $$cap_appname-user
      - $$cap_appname-regulator
      - $$cap_appname-strategic
      - $$cap_appname-kpis
    caproverExtra:
      containerHttpPort: "80"
      notExposeAsWebApp: "true"
      dockerfileLines:
        - FROM node:20-alpine AS build
        - ARG GRC_REPO_URL=$$cap_grc_repo_url
        - ARG GRC_REPO_REF=$$cap_grc_repo_ref
        - WORKDIR /app
        - RUN apk add --no-cache git
        - |
          RUN git config --global url."https://$$cap_repo_username:$$cap_repo_pat@github.com/".insteadOf https://github.com/
          RUN git clone --depth 1 --branch ${GRC_REPO_REF} --recurse-submodules --shallow-submodules ${GRC_REPO_URL} /tmp/grc && \
          cp -R /tmp/grc/front/. /app && \
          rm -rf /tmp/grc
        - RUN npm install
        - RUN npm run build
        - FROM nginx:alpine
        - ARG GRC_REPO_URL=$$cap_grc_repo_url
        - ARG GRC_REPO_REF=$$cap_grc_repo_ref
        - RUN apk add --no-cache git
        - COPY --from=build /app/dist /usr/share/nginx/html
        - |
          RUN git config --global url."https://$$cap_repo_username:$$cap_repo_pat@github.com/".insteadOf https://github.com/
          RUN git clone --depth 1 --branch ${GRC_REPO_REF} --recurse-submodules --shallow-submodules ${GRC_REPO_URL} /tmp/grc && \
          cp /tmp/grc/docker/nginx-frontend.conf /etc/nginx/conf.d/default.conf && \
          rm -rf /tmp/grc
        - EXPOSE 80
        - CMD ["nginx", "-g", "daemon off;"]
  $$cap_appname-gateway:
    restart: always
    depends_on:
      - $$cap_appname-back
      - $$cap_appname-notification
      - $$cap_appname-user
      - $$cap_appname-regulator
      - $$cap_appname-strategic
      - $$cap_appname-kpis
      - $$cap_appname-frontend
    caproverExtra:
      containerHttpPort: "80"
      dockerfileLines:
        - FROM nginx:alpine
        - ARG GRC_REPO_URL=$$cap_grc_repo_url
        - ARG GRC_REPO_REF=$$cap_grc_repo_ref
        - RUN apk add --no-cache git
        - |
        - |-
          RUN git config --global url."https://$$cap_repo_username:$$cap_repo_pat@github.com/".insteadOf https://github.com/
          RUN git clone --depth 1 --branch ${GRC_REPO_REF} --recurse-submodules --shallow-submodules ${GRC_REPO_URL} /tmp/grc && \
              cp /tmp/grc/docker/nginx-gateway.conf /etc/nginx/conf.d/default.conf && \
              rm -rf /tmp/grc
        - EXPOSE 80 3000
        - CMD ["nginx", "-g", "daemon off;"]
caproverOneClickApp:
  variables:
    - id: $$cap_grc_repo_url
      label: Public Git repository URL
      description: Repository that hosts the full GRC source code. Must be reachable by the CapRover builder.
      defaultValue: https://github.com/YOUR_ORG/grc.git
    - id: $$cap_grc_repo_ref
      label: Git branch or tag
      description: Branch, tag, or commit to build for every service.
      defaultValue: master
    - id: $$cap_repo_username
      label: GitHub username
      description: Used for authenticated git clone operations (main repo and private submodules).
    - id: $$cap_repo_pat
      label: GitHub personal access token
      description: Needs repo read access; stored only inside your CapRover instance.
    - id: $$cap_app_env
      label: Laravel APP_ENV
      defaultValue: production
    - id: $$cap_app_debug
      label: Laravel APP_DEBUG
      defaultValue: "false"
    - id: $$cap_mongo_root_user
      label: MongoDB root username
      defaultValue: admin
    - id: $$cap_mongo_root_password
      label: MongoDB root password
      defaultValue: $$cap_gen_random_hex(24)
    - id: $$cap_timezone
      label: Container timezone
      defaultValue: Etc/UTC
  instructions:
    start: |-
      This one-click app provisions the full GRC stack (MongoDB, Redis, six Laravel microservices, the Vue frontend, and an Nginx API gateway).

      Make sure the Git repository you reference is public or accessible from the CapRover server and contains the same folder layout found in this workspace.
    end: |-
      Deployment is triggered for all services. After the green checkmark shows up, set $$cap_appname.$$cap_root_domain as the default domain for $$cap_appname-gateway and enable HTTPS.
  displayName: GRC Platform (multi-service)
  isOfficial: false
  description: Deploys MongoDB, Redis, Laravel microservices, the Vue frontend, and an edge gateway for the GRC platform via CapRover.
  documentation: https://github.com/YOUR_ORG/grc
