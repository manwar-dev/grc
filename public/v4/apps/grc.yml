captainVersion: 4
services:
  $$cap_appname-mongodb:
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: $$cap_mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD: $$cap_mongo_root_password
      TZ: $$cap_timezone
    volumes:
      - $$cap_appname-mongodb-data:/data/db
      - $$cap_appname-mongodb-config:/data/configdb
    caproverExtra:
      notExposeAsWebApp: "true"
  $$cap_appname-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - $$cap_appname-redis-data:/data
    caproverExtra:
      notExposeAsWebApp: "true"
  $$cap_appname-back:
    restart: always
    environment:
      TZ: $$cap_timezone
      APP_ENV: $$cap_app_env
      APP_DEBUG: $$cap_app_debug
      APP_URL: https://$$cap_appname.$$cap_root_domain
      DB_CONNECTION: mongodb
      DB_HOST: srv-captain--$$cap_appname-mongodb
      DB_PORT: "27017"
      DB_DATABASE: grc
      DB_USERNAME: $$cap_mongo_root_user
      DB_PASSWORD: $$cap_mongo_root_password
      CACHE_DRIVER: redis
      REDIS_HOST: srv-captain--$$cap_appname-redis
      REDIS_PORT: "6379"
    volumes:
      - $$cap_appname-back-storage:/var/www/html/storage
    depends_on:
      - $$cap_appname-mongodb
      - $$cap_appname-redis
    caproverExtra:
      containerHttpPort: "80"
      notExposeAsWebApp: "true"
      dockerfileLines:
        - FROM php:8.2-fpm
        - ARG GRC_REPO_URL=$$cap_grc_repo_url
        - ARG GRC_REPO_REF=$$cap_grc_repo_ref
        - ARG SERVICE_PATH=back
        - WORKDIR /var/www/html
        - |
          RUN apt-get update && apt-get install -y \
            git curl libpng-dev libonig-dev libxml2-dev libzip-dev libldap2-dev \
            zip unzip nginx supervisor && \
            apt-get clean && rm -rf /var/lib/apt/lists/*
        - RUN docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd zip ldap
        - |
          RUN pecl install mongodb-1.21.3 redis && docker-php-ext-enable mongodb redis
        - COPY --from=composer:latest /usr/bin/composer /usr/bin/composer
        - |
          RUN git config --global url."https://$$cap_repo_username:$$cap_repo_pat@github.com/".insteadOf https://github.com/
          RUN git clone --depth 1 --branch ${GRC_REPO_REF} --recurse-submodules --shallow-submodules ${GRC_REPO_URL} /tmp/grc && \
              cp -R /tmp/grc/${SERVICE_PATH}/. /var/www/html && \
              cp /tmp/grc/docker/entrypoint.sh /entrypoint.sh && \
              chmod +x /entrypoint.sh && \
              rm -rf /tmp/grc
        - RUN mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
        - RUN cp .env.example .env || true
        - |
          RUN chown -R www-data:www-data /var/www/html && \
            chmod -R 755 /var/www/html && \
            chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
        - |-
          RUN cat <<'EOF' > /etc/nginx/sites-available/default
          server {
            listen 80;
            root /var/www/html/public;
            index index.php;
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }
            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                include fastcgi_params;
            }
          }
          EOF
        - |-
          RUN cat <<'EOF' > /etc/supervisor/conf.d/supervisord.conf
          [supervisord]
          nodaemon=true
          [program:php-fpm]
          command=/usr/local/sbin/php-fpm -F
          autostart=true
          autorestart=true
          [program:nginx]
          command=/usr/sbin/nginx -g "daemon off;"
          autostart=true
          autorestart=true
          EOF
        - RUN mkdir -p /var/log/supervisor
        - EXPOSE 80
        - ENTRYPOINT ["/entrypoint.sh"]
        - CMD ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
  $$cap_appname-notification:
    restart: always
